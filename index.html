<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3R KPI Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --blue:#26A4CB; --blue-d:#136C88; --blue-l:#BFE6F3;
  --ink:#141414; --ink2:#4D4D4D; --bg:#F3F5F6; --panel:#FFFFFF; --line:#DDE3E6;
  --good:#2C9A5B; --warn:#E08A1E; --bad:#C8413A;
  --head:#000000;
  --f:"Archivo", "Arial Black", "Helvetica Neue", Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#EEF2F4;--ink2:#A6B2B8;--bg:#0E1113;--panel:#171B1E;--line:#2A3136}}
:root[data-theme="dark"]{--ink:#EEF2F4;--ink2:#A6B2B8;--bg:#0E1113;--panel:#171B1E;--line:#2A3136}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
img{max-width:100%}
.num{font-variant-numeric:tabular-nums}

/* ---------- Portal header ---------- */
.hdr{background:var(--head);color:#fff;position:relative;overflow:hidden}
.hdr::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(38,164,203,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(38,164,203,.13) 1px,transparent 1px);background-size:22px 22px;pointer-events:none}
.hdr::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--blue)}
.hdr-in{position:relative;display:flex;align-items:center;gap:14px;padding:14px 20px 16px;max-width:1280px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{height:42px;width:auto;max-width:220px;object-fit:contain;display:block}
.logo-plate{display:inline-flex;align-items:center;background:#fff;border-radius:8px;padding:4px 10px}
.tv-top .logo-plate{border-radius:1vh;padding:.6vh 1vw}
.nologo .logo-plate{display:none}
.bmark img{height:54px;width:auto;display:block}
.bword{display:flex;flex-direction:column;gap:4px;min-width:0}
.bwm img{height:28px;width:auto;max-width:48vw;display:block}
.bnm{font-stretch:118%;font-weight:700;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);line-height:1.1;white-space:nowrap}
.tv-top .bmark img{height:8.6vh}
.tv-top .bwm img{height:4.6vh;max-width:40vw}
.tv-top .bnm{font-size:1.7vh}
.tv-top .brand{gap:1.4vw}
@media (max-width:560px){.bmark img{height:40px}.bwm img{height:17px;max-width:calc(100vw - 250px)}.bnm{display:none}.hdr .brand{gap:8px}}
.logo-txt{font-stretch:125%;font-weight:900;font-size:30px;letter-spacing:-.5px;line-height:1}
.logo-txt b{color:var(--blue)}
.brand-sub{font-stretch:100%;font-weight:600;font-size:13px;color:#B9C6CC;line-height:1.2}
.brand-sub strong{display:block;color:#fff;font-stretch:115%;font-weight:800;font-size:15px}
.hdr-sp{flex:1}
.hbtn{background:transparent;border:1.5px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:7px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.hbtn:hover{border-color:var(--blue);color:var(--blue-l)}
.hbtn.on{background:var(--blue);border-color:var(--blue);color:#001}

/* ---------- Admin ---------- */
.wrap{max-width:1280px;margin:0 auto;padding:18px 20px 60px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 18px;padding-bottom:2px}
.tab{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px;white-space:nowrap}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.card+.card{margin-top:14px}
h2{font-stretch:118%;font-weight:900;font-size:22px;margin:0 0 4px;letter-spacing:-.2px}
h3{font-stretch:110%;font-weight:800;font-size:16px;margin:0 0 10px}
.muted{color:var(--ink2)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 13px;font-weight:700;font-size:13px}
.seg button.on{background:var(--blue);color:#001}
.btn{border:0;background:var(--blue);color:#001;font-weight:800;border-radius:8px;padding:9px 16px}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.note{border-left:4px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent);padding:10px 12px;border-radius:6px;font-size:14px}
.note.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,transparent)}
.note.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.tscroll{overflow-x:auto;margin:0 -18px;padding:0 18px}
table.sc{border-collapse:collapse;width:100%;min-width:920px;font-size:14px}
table.sc th{font-stretch:100%;font-weight:700;font-size:12px;color:var(--ink2);text-align:right;padding:8px 8px;border-bottom:1.5px solid var(--line);white-space:nowrap}
table.sc th:first-child,table.sc td:first-child{text-align:left}
table.sc td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.sc tr.tr{cursor:pointer}
table.sc tr.tr:hover td{background:color-mix(in srgb,var(--blue) 7%,transparent)}
table.sc tr.sel td{background:color-mix(in srgb,var(--blue) 12%,transparent)}
.who{display:flex;align-items:center;gap:10px}
.who b{font-stretch:110%;font-weight:800}
.grade{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;font-stretch:125%;font-weight:900;font-size:18px;color:#fff}
.gA{background:var(--good)}.gB{background:var(--blue-d)}.gC{background:#7A8A92}.gD{background:var(--warn)}.gF{background:var(--bad)}
.stars{display:inline-flex;gap:1px}
.stars button{border:0;background:none;padding:0 1px;font-size:18px;line-height:1;color:var(--line)}
.stars button.on{color:#F2B01E}
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:14px}
@media (max-width:820px){.detail{grid-template-columns:1fr}}
.mbar{display:grid;grid-template-columns:130px 1fr 92px;gap:10px;align-items:center;font-size:14px;margin:7px 0}
.mbar .t{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.mbar .t i{display:block;height:100%;background:var(--blue);border-radius:6px}
.mbar .v{text-align:right;font-weight:700}
.olist{width:100%;border-collapse:collapse;font-size:13px}
.olist td{padding:6px 4px;border-bottom:1px solid var(--line)}
.olist td.r{text-align:right;white-space:nowrap}
.age{display:inline-block;padding:1px 7px;border-radius:99px;font-size:12px;font-weight:700;background:var(--line)}
.age.old{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.tcard{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;gap:14px;align-items:center;background:var(--panel)}
.tcard .meta{min-width:0;flex:1}
.tcard input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:7px;padding:6px 9px;background:var(--bg)}
.lbl{display:flex;align-items:center;gap:7px;font-size:13px;margin-top:8px;font-weight:600}
.fgrid{display:grid;grid-template-columns:1fr 110px 130px;gap:8px 12px;align-items:center}
.fgrid input{border:1.5px solid var(--line);border-radius:7px;padding:6px 9px;background:var(--bg);width:100%;text-align:right}
.fgrid .h{font-size:12px;font-weight:700;color:var(--ink2)}
textarea{width:100%;min-height:80px;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);resize:vertical}
input.txt{border:1.5px solid var(--line);border-radius:7px;padding:7px 10px;background:var(--bg);width:100%}

/* ---------- Avatars ---------- */
.av{flex:none;border-radius:50%;overflow:hidden;background:#0C1A20;display:grid;place-items:center;color:#fff;font-stretch:125%;font-weight:900;position:relative;
  background-image:linear-gradient(rgba(38,164,203,.25) 1px,transparent 1px),linear-gradient(90deg,rgba(38,164,203,.25) 1px,transparent 1px);background-size:9px 9px}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.zoom img{transform:scale(1.9);transform-origin:50% 40%}
.av.s{width:38px;height:38px;font-size:14px}
.av.m{width:64px;height:64px;font-size:22px}

/* ---------- Board (TV) ---------- */
body.tv{background:#000;color:#fff;overflow:hidden;height:100%}
body.tv .hdr{display:none}
.tv-shell{position:fixed;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 2vh) 3vw calc(env(safe-area-inset-bottom,0px) + 2vh);
  background:#000;
  background-image:linear-gradient(rgba(38,164,203,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(38,164,203,.07) 1px,transparent 1px);background-size:4vh 4vh}
.tv-top{display:flex;align-items:center;gap:2vw;padding-bottom:1.6vh;border-bottom:.5vh solid var(--blue)}
.tv-top .logo{height:6.4vh;max-width:22vw}
.tv-top .logo-txt{font-size:5.4vh}
.tv-title{font-stretch:125%;font-weight:900;font-size:3.6vh;letter-spacing:-.02em;line-height:1}
.tv-sub{font-stretch:100%;font-weight:600;font-size:1.9vh;color:#9FB1B8;margin-top:.4vh}
.tv-clock{margin-left:auto;text-align:right;font-stretch:110%;font-weight:800;font-size:3.2vh;line-height:1.1}
.tv-clock small{display:block;font-weight:600;font-size:1.6vh;color:#9FB1B8;font-stretch:100%}
.tv-ctl{display:flex;gap:.6vw}
.tv-ctl button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:.8vh;padding:.7vh 1vw;font-size:1.6vh;font-weight:700}
.tv-stage{flex:1;position:relative;min-height:0;overflow:hidden}
.slide{position:absolute;inset:0;padding:3vh 0 1vh;display:flex;flex-direction:column;opacity:0;transition:opacity .6s ease;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:reduce){.slide{transition:none}}
.tv-foot{display:flex;align-items:center;gap:1vw;padding-top:1.2vh;font-size:1.6vh;color:#8397A0}
.dots{display:flex;gap:.6vw;flex:1}
.dots i{height:.6vh;flex:1;max-width:6vw;background:rgba(255,255,255,.14);border-radius:1vh;overflow:hidden;position:relative}
.dots i.done{background:var(--blue)}
.dots i.cur::after{content:"";position:absolute;inset:0;background:var(--blue);transform-origin:left;animation:fill var(--dur,15s) linear forwards}
.paused .dots i.cur::after{animation-play-state:paused}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.kicker{font-stretch:100%;font-weight:700;font-size:2.2vh;color:var(--blue)}
.big-h{font-stretch:125%;font-weight:900;font-size:6.2vh;line-height:.98;letter-spacing:-.03em;margin:.6vh 0 2.4vh}

/* goal slide */
.goal-big{display:flex;align-items:flex-end;gap:2vw;flex-wrap:wrap}
.goal-num{font-stretch:125%;font-weight:900;font-size:17vh;line-height:.82;letter-spacing:-.045em}
.goal-of{font-stretch:105%;font-weight:700;font-size:3.2vh;color:#B9C6CC;padding-bottom:1.4vh}
.goal-of b{color:#fff}
.gbar{position:relative;height:7vh;background:#12191C;border:1px solid #23313A;border-radius:1.2vh;margin:3.4vh 0 1.2vh;overflow:visible}
.gbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--blue-d),var(--blue));border-radius:1.2vh}
.gbar .pace{position:absolute;top:-1.4vh;bottom:-1.4vh;width:.35vh;background:#fff}
.gbar .pace span{position:absolute;top:-3vh;left:50%;transform:translateX(-50%);font-size:1.6vh;font-weight:700;white-space:nowrap;color:#fff}
.gbar .pct{position:absolute;right:1.5vw;top:50%;transform:translateY(-50%);font-stretch:120%;font-weight:900;font-size:3.6vh}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:1.4vw;margin-top:auto}
.tile{border:1px solid #23313A;background:rgba(18,25,28,.85);border-radius:1.4vh;padding:2vh 1.4vw}
.tile .l{font-size:1.9vh;font-weight:600;color:#9FB1B8}
.tile .v{font-stretch:122%;font-weight:900;font-size:5.4vh;line-height:1.05;letter-spacing:-.02em}
.tile .s{font-size:1.7vh;color:#9FB1B8}
.tile .mini{height:.8vh;background:#23313A;border-radius:1vh;margin-top:1vh;overflow:hidden}
.tile .mini i{display:block;height:100%;background:var(--blue)}

/* leaderboard slide */
.lb{display:flex;flex-direction:column;gap:1.1vh;flex:1;min-height:0}
.lbr{display:grid;grid-template-columns:5vh 7.4vh minmax(0,1.5fr) 6vh repeat(5,minmax(0,1fr));gap:1.4vw;align-items:center;background:rgba(18,25,28,.85);border:1px solid #23313A;border-radius:1.4vh;padding:1vh 1.4vw;flex:1;max-height:11vh;min-height:0}
.lbr.top{border-color:var(--blue);background:linear-gradient(90deg,rgba(38,164,203,.18),rgba(18,25,28,.85) 60%)}
.lbr .rk{font-stretch:125%;font-weight:900;font-size:4.4vh;color:#5E747D}
.lbr.top .rk{color:var(--blue)}
.lbr .av{width:7.4vh;height:7.4vh;font-size:2.8vh}
.lbr .nm{font-stretch:118%;font-weight:900;font-size:3.4vh;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbr .nm small{display:block;font-stretch:100%;font-weight:600;font-size:1.6vh;color:#9FB1B8;margin-top:.5vh}
.lbr .grade{width:6vh;height:6vh;font-size:3.4vh;border-radius:1vh}
.lbr .c{text-align:right}
.lbr .c b{display:block;font-stretch:115%;font-weight:900;font-size:3vh;line-height:1.05}
.lbr .c span{font-size:1.5vh;color:#9FB1B8;font-weight:600}
.lbh{display:grid;grid-template-columns:5vh 7.4vh minmax(0,1.5fr) 6vh repeat(5,minmax(0,1fr));gap:1.4vw;padding:0 1.4vw;font-size:1.6vh;color:#8397A0;font-weight:700}
.lbh span{text-align:right}

/* spotlight */
.spot{display:grid;grid-template-columns:auto 1fr;gap:4vw;align-items:center;flex:1;padding-left:1.6vh}
.spot .av{width:44vh;height:44vh;font-size:14vh;border:.8vh solid var(--blue);box-shadow:0 0 0 1.4vh rgba(38,164,203,.15)}
.spot .nm{font-stretch:125%;font-weight:900;font-size:11vh;line-height:.9;letter-spacing:-.04em}
.spot .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2vw;margin-top:3vh}

/* ytd */
.ytd{display:flex;flex-direction:column;gap:3vh;flex:1;justify-content:center}
.yrow .top{display:flex;align-items:baseline;gap:1.4vw}
.yrow .nm{font-stretch:110%;font-weight:800;font-size:3vh}
.yrow .val{margin-left:auto;font-stretch:120%;font-weight:900;font-size:4vh}
.yrow .val small{font-size:2vh;color:#9FB1B8;font-weight:700;font-stretch:100%}
.yrow .bar{height:3.2vh;background:#12191C;border:1px solid #23313A;border-radius:1vh;margin-top:1vh;position:relative;overflow:hidden}
.yrow .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--blue)}
.yrow .bar .pace{position:absolute;top:0;bottom:0;width:.3vh;background:#fff}

/* reviews + announcements */
.quote{font-stretch:108%;font-weight:700;font-size:5.2vh;line-height:1.18;letter-spacing:-.01em;max-width:80vw}
.quote::before{content:"\201C";display:block;font-stretch:125%;font-weight:900;font-size:16vh;line-height:.6;color:var(--blue);margin-bottom:2vh}
.qby{margin-top:3vh;font-size:2.6vh;color:#B9C6CC;font-weight:600}
.qby .st{color:#F2B01E;letter-spacing:.3vh;margin-right:1vw}
.rv-more{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4vw;margin-top:auto}
.rv-more .tile{font-size:2vh;line-height:1.35}
.ann{flex:1;display:flex;flex-direction:column;justify-content:center}
.ann .ic{font-size:14vh;line-height:1}
.ann .badge{display:inline-block;margin-top:2vh;background:var(--blue);color:#001;font-weight:800;font-size:2.2vh;padding:.6vh 1.2vw;border-radius:.8vh;align-self:flex-start}
.ann .msg{font-stretch:120%;font-weight:900;font-size:8vh;line-height:1;letter-spacing:-.03em;margin-top:2.4vh;max-width:86vw}
.ann .sub{font-size:3vh;color:#B9C6CC;margin-top:2.4vh;font-weight:600}
.empty-tv{flex:1;display:grid;place-items:center;text-align:center;font-size:2.6vh;color:#9FB1B8}
.empty-tv b{display:block;color:#fff;font-stretch:120%;font-weight:900;font-size:5vh;margin-bottom:1vh}

/* portrait / phone board */
@media (max-aspect-ratio:1/1){
  .tv-shell{padding-left:4vw;padding-right:4vw}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .goal-num{font-size:10vh}
  .lbr,.lbh{grid-template-columns:4vh 6vh minmax(0,1fr) 5vh repeat(2,minmax(0,1fr))}
  .lbr .c.x,.lbh .x{display:none}
  .spot{grid-template-columns:1fr;justify-items:start}
  .spot .av{width:24vh;height:24vh;font-size:8vh}
  .spot .nm{font-size:7vh}
  .quote{font-size:3.4vh}
  .ann .msg{font-size:5vh}
  .rv-more{grid-template-columns:1fr}
  .rv-more .tile:nth-child(n+2){display:none}
  .tv-title{font-size:2.4vh}.tv-sub{display:none}.tv-clock{font-size:2.2vh}
}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:#161616;color:#fff;border-left:4px solid var(--blue);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:50;display:none}
.toast.on{display:block}
.tv-right{margin-left:auto;display:flex;align-items:center;gap:2.4vw}
.tv-right .tv-clock{margin-left:0}
.wx-chip{display:flex;align-items:center;gap:.8vw;border-left:1px solid #23313A;padding-left:2vw}
.wx-chip span{font-size:4.2vh;line-height:1}
.wx-chip b{font-stretch:120%;font-weight:900;font-size:4.4vh;line-height:1}
.wx-chip small{font-size:1.6vh;color:#9FB1B8;font-weight:600;max-width:6vw;line-height:1.2}
.split{display:grid;grid-template-columns:1fr 1fr;gap:2vw;margin-top:3.4vh}
.sp-top{display:flex;justify-content:space-between;align-items:baseline;font-size:2.2vh;color:#B9C6CC;font-weight:600}
.sp-top b{color:#fff;font-stretch:115%;font-weight:900;font-size:3.2vh}
.sp-top small{font-size:1.8vh;color:#9FB1B8;font-weight:700;font-stretch:100%}
.sp-bar{position:relative;height:2.2vh;background:#12191C;border:1px solid #23313A;border-radius:1vh;margin-top:1vh;overflow:hidden}
.sp-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--blue)}
.sp-bar em{position:absolute;top:0;bottom:0;width:.3vh;background:#fff}
.trend{flex:1;min-height:0;display:flex}
.trend svg{width:100%;height:100%;display:block}
.scrollbox{flex:1;min-height:0;overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(#000 92%,transparent);mask-image:linear-gradient(#000 92%,transparent)}
.scrollin{display:flex;flex-direction:column;gap:1vh;will-change:transform}
.scrollin.run{animation:scrollup var(--sd,30s) linear infinite}
@keyframes scrollup{0%,10%{transform:translateY(0)}100%{transform:translateY(calc(-1 * var(--sh,0px)))}}
.slide .lb.scrollin .lbr{flex:none;height:9.6vh;max-height:none}
.slide .scrollin .st-r{flex:none;height:9vh;max-height:none}
.st-r.top{border-color:var(--blue);background:linear-gradient(90deg,rgba(38,164,203,.18),rgba(18,25,28,.85) 60%)}
.st-r .rk{font-stretch:125%;font-weight:900;font-size:3.4vh;color:#5E747D}.st-r.top .rk{color:var(--blue)}

const FIELD_TEAM = /plumb|hvac|apprentic|electric|install|service|tech/i;
const GRACE_MIN = 10;
const INSTALL_HOURS = 4;
// install job types (ServiceTitan "Job Type"); sales visits, estimates and warranty trips never count
const INSTALL_TYPE = /install|replacement|conversion|full system|plumbing project|rough and finish/i;
const NOT_INSTALL = /sales|estimate|warranty|inspection/i;
const SLIDES = [
  {k:"goal",  label:"Monthly goal (install + service split)"},

  slides: Object.fromEntries(SLIDES.map(s=>[s.k,true])),

/* ===================== state ===================== */
const S = {
  snap:null, snapSource:"", snapAt:0,
  techs:{}, cfg:defaultCfg(),
  canEdit:false, isOwner:false,
  db:null, assets:null, mcp:null,
  sync:{state:"idle", msg:"Connecting…"},
  route: location.hash.replace("#","") || "",
  period:"mtd", sel:null, adminTab:"score",
  slide:0, cycle:0, paused:false

/* ===================== utils ===================== */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { if (typeof v==="number") return isFinite(v)?v:0; if (v==null||v==="") return 0; let s=String(v).trim(); let neg=/^\(.*\)$/.test(s)||/^-/.test(s.replace(/\$/,"")); s=s.replace(/[^0-9.]/g,""); const n=parseFloat(s)||0; return neg?-n:n; };
const bool = v => v===true || /^true$/i.test(String(v).trim());
const toDate = v => {
  if (v instanceof Date) return isNaN(v)?null:v;
  if (typeof v==="number" && v>20000 && v<80000) return new Date(Math.round((v-25569)*864e5) + new Date().getTimezoneOffset()*6e4);
  if (!v) return null;
  const m = String(v).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?:[ T]+(\d{1,2}):(\d{2}))?/);
  if (m) return new Date(+(m[3].length===2?"20"+m[3]:m[3]), +m[1]-1, +m[2], +(m[4]||0), +(m[5]||0));
  const d = new Date(v); return isNaN(d)?null:d;
};
const key = name => String(name||"").trim().split(/\s+/)[0].toLowerCase().replace(/[^a-z0-9]/g,"");
const money = (n, short) => { n=+n||0; if (short && Math.abs(n)>=1e6) return "$"+(n/1e6).toFixed(2).replace(/\.?0+$/,"")+"M"; if (short && Math.abs(n)>=1e4) return "$"+Math.round(n/1e3)+"K"; return (n<0?"-":"")+"$"+Math.round(Math.abs(n)).toLocaleString(); };
const pct = n => Math.round((+n||0)*100)+"%";
const fmtM = (m, v) => m.fmt==="$"?money(v):m.fmt==="%"?pct(v):m.fmt==="★"?(v?(+v).toFixed(1)+"★":"—"):String(Math.round((+v||0)*10)/10);
const initials = n => String(n||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
const firstName = n => String(n||"").trim().split(/\s+/)[0];
const hashStr = s => { let h=5381; for (let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return (h>>>0).toString(36); };
let toastT; const toast = m => { const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),2600); };
const ago = ms => { if(!ms) return "never"; const s=(Date.now()-ms)/1000; if (s<90) return "just now"; if (s<3600) return Math.round(s/60)+" min ago"; if (s<86400) return Math.round(s/3600)+" hr ago"; return new Date(ms).toLocaleDateString(); };

/* ===================== workbook → snapshot ===================== */
function sheetRows(wb, name){
  if (wb.__rows) return wb.__rows[name.trim().toLowerCase()] || [];
  const n = wb.SheetNames.find(x => x.trim().toLowerCase()===name.toLowerCase());
  if (!n) return [];
  return XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, raw:true, defval:""});
}
function firstRows(wb, names){ for (const n of names){ const r=sheetRows(wb,n); if (r.length>1) return r; } return []; }
function kvSheet(rows){
  const out = {};
  for (const r of rows.slice(1)){ const k=String(r[0]).trim(); if (k.toLowerCase()==="date") break; if (k && !/^[💡⚠]/u.test(k)) out[k]={v:num(r[1]), raw:r[1], label:String(r[2]||k), where:String(r[3]||"")}; }
  return out;
}
function headerIndex(rows, test){
  const i = rows.findIndex(test); if (i<0) return {i:-1, h:{}};
  const h={}; rows[i].forEach((c,j)=>{ h[String(c).trim().toLowerCase()]=j; }); return {i,h};
}
const MK = ["rev","jobs","paid","opp","conv","sold","soldN","estN","gm","hrs","leads","recall","booked","instRev","svcRev","instN","soldHrs","warr"];
const zeros = () => Array(12).fill(0);
const newBucket = () => Object.fromEntries(MK.map(k=>[k,zeros()]));
const newFlat = () => Object.fromEntries(MK.map(k=>[k,0]));
function buildSnapshot(wb, now=new Date()){
  const Y=now.getFullYear(), M=now.getMonth();
  const yStart=new Date(Y,0,1), l30=new Date(now-30*864e5);
  const goals = kvSheet(sheetRows(wb,"Goals"));
  const ytdGoals = kvSheet(sheetRows(wb,"YTD Goals"));
  const actuals = kvSheet(sheetRows(wb,"Actuals"));

  // Leaderboard (manual)
  const lbRows = sheetRows(wb,"Leaderboard");
  const {i:lbi,h:lbh} = headerIndex(lbRows, r => String(r[0]).trim().toLowerCase()==="name");
  const board = {};
  if (lbi>=0) lbRows.slice(lbi+1).forEach(r=>{
    const nm=String(r[lbh.name]??"").trim(); if(!nm || nm.startsWith("←")) return;
    const g = c => num(r[lbh[c]]);
    board[key(nm)] = {name:nm, status:String(r[lbh.status]??"active").trim().toLowerCase()||"active",
      mem_mtd:g("mem_mtd"), rv_mtd:g("rv_mtd"), inst_mtd:g("inst_mtd"), mem_ytd:g("mem_ytd"), rv_ytd:g("rv_ytd"),
      rev_ytd:g("rev_ytd"), sold_ytd:g("sold_ytd")};
  });
  const rec = name => { const rows=sheetRows(wb,name); const {i}=headerIndex(rows, r=>String(r[0]).trim().toLowerCase()==="tech name"); const o={};
    if(i>=0) rows.slice(i+1).forEach(r=>{ const nm=String(r[0]).trim(); if(!nm) return; const months=[]; for(let m=1;m<=12;m++) months.push(num(r[m])); o[key(nm)]=months; });
    return o; };
  const cbRec = rec("Call Back Record"), instRec = rec("Install Record");

  const T = {}; const tech = nm => { const k=key(nm); if(!k) return null;
    if(!T[k]) T[k]={k, full:String(nm).trim(), y:newBucket(), l30:newFlat(), open:[], openAmt:0};
    else if(String(nm).trim().length>T[k].full.length) T[k].full=String(nm).trim(); return T[k]; };
  const co = {y:newBucket(), l30:newFlat()};
  let maxDate=null, jobRows=0, estRows=0; const flags=[];
  const add = (targets, d, f) => { if(!d) return; const inY = d>=yStart && d<=now && d.getFullYear()===Y, in30 = d>=l30 && d<=now;
    for (const x of targets) if (x){ if(inY) f(x.y, d.getMonth(), true); if(in30) f(x.l30, null, false); } };
  const inc = (o,m,k,v) => { if (m==null) o[k]+=v; else o[k][m]+=v; };

  // Jobs
  const jr = firstRows(wb,["ST Jobs","Automation Jobs"]);
  const {i:ji,h:jh} = headerIndex(jr, r => r.some(c=>String(c).trim().toLowerCase()==="primary technician"));
  const col = (r,n) => jh[n]!=null ? r[jh[n]] : "";
  // appointment length per job (Zapier: ST Appointments). Falls back to Total Hours Worked if missing.
  const apRows = sheetRows(wb,"ST Appointments"); const {i:api,h:aph} = headerIndex(apRows, r=>String(r[0]).trim().toLowerCase()==="job id");
  const apptHrs = {}; if (api>=0) apRows.slice(api+1).forEach(r=>{ apptHrs[String(r[aph["job id"]])]=num(r[aph["appointment hours"]]); });
  const useAppt = api>=0;
  if (ji>=0) jr.slice(ji+1).forEach(r=>{
    const status = String(col(r,"status")).trim().toLowerCase(); if(!status) return; jobRows++;
    const created = toDate(col(r,"created date"));
    if (status!=="canceled" && status!=="cancelled") add([co], created, (o,m)=>inc(o,m,"booked",1));
    const lead = String(col(r,"lead generated by")).trim();
    if (lead) add([tech(lead), co], created, (o,m)=>inc(o,m,"leads",1));
    if (status!=="completed") return;
    const d = toDate(col(r,"completion date")); if(!d) return;
    if(!maxDate||d>maxDate) maxDate=d;
    const t = tech(col(r,"primary technician"));
    const rev = num(col(r,"jobs total revenue") || col(r,"jobs total"));
    const opp = bool(col(r,"opportunity")), conv = bool(col(r,"converted")), recall = bool(col(r,"recall"));
    const gm = num(col(r,"jobs gross margin")), hrs = num(col(r,"total hours worked")); const soldHrs = num(col(r,"sold hours")), warr = bool(col(r,"warranty"));
    const isInst = /install|replace|new system/i.test(String(col(r,"business unit"))+" "+String(col(r,"job type")));
    // installs = install job type AND over 4 hours; long jobs without an install type get flagged
    const jtype=String(col(r,"job type")||"");
    const len = useAppt ? (apptHrs[String(col(r,"job id"))] ?? 0) : hrs;
    if (len>INSTALL_HOURS && (useAppt || jh["total hours worked"]!=null) && d.getFullYear()===Y) {
      if (INSTALL_TYPE.test(jtype) && !NOT_INSTALL.test(jtype)) add([t, co], d, (o,m)=>inc(o,m,"instN",1));

/* ===================== scoring ===================== */
const sumTo = (arr, M) => (arr||[]).slice(0, M+1).reduce((a,b)=>a+(+b||0),0);
function pick(bucket, flat, P, M, m){
  if (P==="l30") return flat;
  const o={}; for (const k of MK) o[k] = m!=null ? ((bucket[k]||[])[m]||0) : P==="mtd" ? ((bucket[k]||[])[M]||0) : sumTo(bucket[k], M); return o;
}
function derive(s){ return {...s, avg:s.paid?s.rev/s.paid:0, close:s.opp?s.conv/s.opp:0, gmPct:s.rev>0?s.gm/s.rev:0, revHr:s.hrs>0?s.rev/s.hrs:0}; }
/* m = a single month index (monthly table); otherwise P = mtd | l30 | ytd */
function statsFor(t, P, m){
  const M = S.snap ? S.snap.month : new Date().getMonth();
  const s = derive(pick(t.y, t.l30, P, M, m));
  s.cb = m!=null ? (t.cb[m]||0) : P==="ytd" ? sumTo(t.cb,M) : P==="l30" ? (t.cb[M]||0) : (t.cb[M]||0);
  s.inst = m!=null ? (t.inst[m]||0) : P==="ytd" ? sumTo(t.inst,M) : (t.inst[M]||0);
  s.mem = m!=null ? (t.mem.m ? t.mem.m[m] : (m===M?t.mem.mtd:null)) : P==="ytd" ? t.mem.ytd : P==="l30" && t.mem.m ? t.mem.m[M]+(new Date().getDate()<30&&M>0?t.mem.m[M-1]:0) : t.mem.mtd;
  s.rv = m!=null ? (t.rv.m ? t.rv.m[m] : (m===M?t.rv.mtd:null)) : P==="ytd" ? t.rv.ytd : P==="l30" && t.rv.m ? t.rv.m[M]+(new Date().getDate()<30&&M>0?t.rv.m[M-1]:0) : t.rv.mtd;
  s.rating = (S.techs[t.k]||{}).rating||0; s.openAmt=t.openAmt||0; s.openN=t.openN||0; s.overdue=t.overdueN||0;
  s.cbRate = s.jobs ? s.cb/s.jobs : 0; s.eff = s.hrs ? (s.soldHrs||0)/s.hrs : 0; s.estClose = s.estN ? s.soldN/s.estN : 0; s.avgSale = s.soldN ? s.sold/s.soldN : 0;
  const a=t.att; const pickA=f=> !a?0 : m!=null ? (a.y[f][m]||0) : P==="ytd" ? sumTo(a.y[f],M) : P==="l30" ? (a.l30[f]||0) : (a.y[f][M]||0);
  s.sched=pickA("sched"); s.daysW=pickA("days"); s.late=pickA("late"); s.missed=pickA("missed"); s.pto=pickA("pto"); s.clockHrs=pickA("hrs");
  s.hasAtt=!!a; s.attend=s.sched?Math.max(0,(s.sched-s.missed)/s.sched):0; s.onTime=s.daysW?(s.daysW-s.late)/s.daysW:0;
  // same points formula as the original GitHub board
  s.pts = Math.round((s.rev||0)/100 + (s.sold||0)/150 + (s.mem||0)*50 + (s.rv||0)*25 + (s.inst||0)*15);
  return s;
}
function coStats(P, m){
  const snap=S.snap; const M=snap.month; const s=derive(pick(snap.co.y, snap.co.l30, P, M, m));
  if (S.cfg.coSource==="actuals" && P==="mtd" && m==null){ const A=snap.actuals; if(A.rev) s.rev=A.rev.v; if(A.sr) s.sold=A.sr.v; if(A.cb) s.booked=A.cb.v; }
  if (P==="mtd" && m==null && !snap.jobRows){ const A=snap.actuals; s.rev=(A.rev||{}).v||0; s.sold=(A.sr||{}).v||0; s.booked=(A.cb||{}).v||0; }
  return s;
}
const roleOf = t => (S.techs[t.k]||{}).role || t.role || "tech";
function scoreTech(t, P){
  if (roleOf(t)==="apprentice") return scoreWith(t, P, APP_METRICS, S.cfg.appMetrics||{});
  if (roleOf(t)==="sales") return scoreWith(t, P, SALES_METRICS, S.cfg.salesMetrics||{});
  return scoreWith(t, P, METRICS, S.cfg.metrics);
}
function scoreWith(t, P, SET, CFGM){
  const st = statsFor(t,P); const monthsIn = S.snap ? S.snap.month + new Date().getDate()/31 : 1;
  let tw=0, tot=0; const parts={};
  SET.forEach(m=>{
    const c = CFGM[m.k]||{w:m.w,target:m.target}; const w=+c.w||0; let target=+c.target||m.target;
    if (m.ytdScale && P==="ytd") target*=Math.max(1,monthsIn);
    const v = st[m.k]; let s;
    if (m.k==="rating" && !v) { parts[m.k]={v,s:null,target}; return; }
    if (SET===APP_METRICS && !st.hasAtt && m.k!=="rating") { parts[m.k]={v,s:null,target}; return; }
    if (m.inverse) s = v<=0?1:Math.max(0, 1 - v/(2*target));
    else s = target>0?Math.min(1, (v||0)/target):0;
    parts[m.k]={v,s,target};
    if (w>0){ tw+=w; tot+=w*s; }
  });
  const score = tw?Math.round(tot/tw*100):0;
  return {score, grade: score>=90?"A":score>=80?"B":score>=70?"C":score>=60?"D":"F", parts, st};
}
// everyone who sells (sales side + techs like Marc), ranked by sold, each with a sales score
function salesRoster(forBoard){
  const P = forBoard ? S.cfg.boardPeriod : S.period;
  return roster(forBoard,"all").map(r=>{ const y=statsFor(r.t,"ytd"); return {...r, y, sc:scoreWith(r.t,P,SALES_METRICS,S.cfg.salesMetrics||{}), side:roleOf(r.t)}; })
    .filter(r=>r.y.sold>0 || r.y.estN>0 || r.side==="sales")
    .sort((a,b)=>b.st.sold-a.st.sold || b.y.sold-a.y.sold);
}
function roster(forBoard, which){
  if (!S.snap) return [];
  which = which || "tech";

    const o = S.techs[t.k]||{};

  }).map(t=>({t, name:(S.techs[t.k]||{}).display || firstName(t.full), ...scoreTech(t, forBoard?S.cfg.boardPeriod:S.period)}))

let slideDur=0;
function armScroll(){
  slideDur=0;
  document.querySelectorAll(".slide.on .scrollbox").forEach(box=>{
    const inn=box.querySelector(".scrollin"); if(!inn) return;
    const h=inn.scrollHeight; if (h <= box.clientHeight+4) return;
    const gap=parseFloat(getComputedStyle(inn).rowGap)||0;
    inn.insertAdjacentHTML("beforeend", inn.innerHTML);            // second copy = seamless loop
    const dist=h+gap, pxPerSec=Math.max(20, window.innerHeight*0.045); // ~one row every 2 s
    const secs=Math.max(8, dist/pxPerSec)/0.9;                       // first 10% holds at the top
    inn.style.setProperty("--sh", dist+"px"); inn.style.setProperty("--sd", secs+"s"); inn.classList.add("run");
    slideDur=Math.max(slideDur, secs);
  });
  if (slideDur){ const dots=document.querySelector(".dots"); if(dots) dots.style.setProperty("--dur", Math.max(S.cfg.rotateSec, slideDur)+"s"); }
}
function go(d){ lastAdvance=Date.now(); const n=activeSlides().length; const nx=(S.slide+d+n)%n; if (d>0 && nx===0) S.cycle=(S.cycle||0)+1; S.slide=nx; renderBoard(); }
function schedule(){ clearTimeout(slideTimer); if(!S.paused && route()==="board") slideTimer=setTimeout(()=>go(1), Math.max(S.cfg.rotateSec, slideDur)*1000); }
function tick(){
  const c=$("#clock"); if(c){ const d=new Date(); c.innerHTML=`${d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})}<small>${d.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}</small>`; }
  const u=$("#upd"); if(u) u.textContent = S.snap ? `Updated ${ago(S.snapAt)}${S.snap.dataThrough?" · data through "+new Date(S.snap.dataThrough+"T12:00").toLocaleDateString("en-US",{month:"short",day:"numeric"}):""}` : "";
}

function wireAdmin(){

  document.querySelectorAll("[data-sel]").forEach(tr=>tr.onclick=e=>{ if(e.target.closest(".stars")) return; S.sel = S.sel===tr.dataset.sel?null:tr.dataset.sel; renderAdmin(); if(S.sel) setTimeout(()=>{const d=document.querySelector(".detail"); d&&d.scrollIntoView({behavior:"smooth",block:"start"});},30); });
  document.querySelectorAll("[data-rate]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); const k=b.dataset.rate, n=+b.dataset.n; const cur=(S.techs[k]||{}).rating||0; saveTech(k,{rating: cur===n?0:n}); });
  const notes=$("#notes"); if(notes){ let t; notes.oninput=()=>{clearTimeout(t); t=setTimeout(()=>saveTech(notes.dataset.k,{notes:notes.value.slice(0,4000)},true),900);}; }
  document.querySelectorAll("[data-disp]").forEach(i=>i.onchange=()=>saveTech(i.dataset.disp,{display:i.value.trim().slice(0,30)}));
  document.querySelectorAll("[data-show]").forEach(i=>i.onchange=()=>saveTech(i.dataset.show,{show:i.checked}));

  document.querySelectorAll("[data-photo]").forEach(i=>i.onchange=()=>i.files[0]&&uploadPhoto(i.dataset.photo,i.files[0]));
  document.querySelectorAll("[data-unphoto]").forEach(b=>b.onclick=()=>saveTech(b.dataset.unphoto,{photo:"", photoSrc:"removed"}));
  const ss=$("#saveScoring"); if(ss) ss.onclick=()=>{ const m={}; METRICS.forEach(x=>{ m[x.k]={w:Math.max(0,+document.querySelector(`[data-w="${x.k}"]`).value||0), target:Math.max(0,+document.querySelector(`[data-tg="${x.k}"]`).value||x.target)}; }); const am={}; APP_METRICS.forEach(x=>{ am[x.k]={w:Math.max(0,+document.querySelector(`[data-aw="${x.k}"]`).value||0), target:Math.max(0,+document.querySelector(`[data-atg="${x.k}"]`).value||x.target)}; }); const sm={}; SALES_METRICS.forEach(x=>{ sm[x.k]={w:Math.max(0,+document.querySelector(`[data-sw="${x.k}"]`).value||0), target:Math.max(0,+document.querySelector(`[data-stg="${x.k}"]`).value||x.target)}; }); saveCfg({metrics:m, appMetrics:am, salesMetrics:sm},"Scoring rules saved"); };
  const rs=$("#resetScoring"); if(rs) rs.onclick=()=>saveCfg({metrics:defaultCfg().metrics, appMetrics:defaultCfg().appMetrics, salesMetrics:defaultCfg().salesMetrics},"Scoring reset to defaults");
  const sb=$("#saveBoard"); if(sb) sb.onclick=()=>{ const sl={}; document.querySelectorAll("[data-slide]").forEach(c=>sl[c.dataset.slide]=c.checked); saveCfg({rotateSec:Math.min(120,Math.max(5,+$("#rotSec").value||15)), boardPeriod:$("#bPer").value, spotMode:$("#spMode").value, coSource:$("#coSrc").value, tvGrades:$("#tvGr").checked, slides:sl},"Board settings saved"); };
  const lu=$("#logoUp"); if(lu) lu.onchange=async()=>{ const f=lu.files[0]; if(!f) return; try{ const blob=f.type==="image/svg+xml"?f:await resize(f,800,false); const a=await S.assets.upload(blob); await saveCfg({logoId:a.id},"Logo updated"); }catch(e){ toast(uploadMsg(e)); } };
  const lr=$("#logoRm"); if(lr) lr.onclick=()=>saveCfg({logoId:""},"Using the Drive logo");
  const lp=$("#logoPlate"); if(lp) lp.onchange=()=>saveCfg({logoPlate:lp.checked},"Logo background updated");
  const sn=$("#syncNow"); if(sn) sn.onclick=()=>{ if(!S.mcp) return; S.sync={state:"busy",msg:"Reading the sheet…"}; renderAdmin(); try{ S.mcp.invalidate(DRIVE, DL_TOOL); }catch(e){} };

async function saveTech(k, patch, quiet){
  const next = {...(S.techs[k]||{}), ...patch}; S.techs[k]=next; if(!quiet) route()==="admin"&&renderAdmin();
  if (!S.db) { toast("Saving isn't available in this view"); return; }
  try { await S.db.doc("techs/"+k).set(next); if(quiet && patch.notes!==undefined) toast("Notes saved"); }
  catch(e){ toast(e&&e.code==="invalid_argument"?"You need editor access to change this":"Couldn't save. Try again."); }
}
async function saveCfg(patch, msg){
  S.cfg = {...S.cfg, ...patch}; render();
  if (!S.db) { toast("Saving isn't available in this view"); return; }
  try { await S.db.doc("config/settings").set(S.cfg); toast(msg); }
  catch(e){ toast(e&&e.code==="invalid_argument"?"You need editor access to change this":"Couldn't save. Try again."); }
}
function uploadMsg(e){ const c=e&&e.code; return c==="quota_exceeded"?"Photo storage is full. Remove old photos first.":c==="invalid_request"?"That file type can't be used. Try a JPG or PNG.":"Upload failed. Try again."; }
function resize(file, max, square){
  return new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>{ let w=img.width,h=img.height,sx=0,sy=0,sw=w,sh=h;
    if(square){ const m=Math.min(w,h); sx=(w-m)/2; sy=(h-m)/4; sw=sh=m; w=h=Math.min(max,m);} else { const r=Math.min(1,max/Math.max(w,h)); w=Math.round(w*r); h=Math.round(h*r); }
    const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(img,sx,sy,sw,sh,0,0,w,h);
    c.toBlob(b=>b?res(b):rej(new Error("encode")), square?"image/jpeg":"image/png", .86); URL.revokeObjectURL(img.src); };
    img.onerror=()=>rej({code:"invalid_request"}); img.src=URL.createObjectURL(file); });
}
async function uploadPhoto(k, file){
  if (!S.assets) return; toast("Uploading photo…");
  try { const blob=await resize(file,480,true); const a=await S.assets.upload(blob); await saveTech(k,{photo:a.id, photoSrc:"manual"}); toast("Photo saved"); }
  catch(e){ toast(uploadMsg(e)); }
}

/* ===================== tech photos from Drive ===================== */
// Kate's headshot folder: files named Last_First.jpeg. Matched to techs by first name.
const PHOTO_FOLDER = "11gVMpNygKLHh7vHBqly2c3lj9WwNef_j";
let photoSyncRunning=false;
function b64ToBlob(b64, type){ const bin=atob(b64); const a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return new Blob([a],{type:type||"image/jpeg"}); }
function matchTechKey(title){
  const parts=String(title||"").replace(/\.[^.]+$/,"").split(/[_\s.-]+/).filter(Boolean);
  const techs=(S.snap&&S.snap.techs)||{};
  for (const p of parts.slice().reverse()){ const k=key(p); if (techs[k]) return k; }
  // fall back to last name (e.g. "Post_John.jpeg" → Jack Post) when it's unique
  const byLast={}; Object.values(techs).forEach(t=>{ const w=String(t.full||"").trim().split(/\s+/); if(w.length>1){ const l=key(w[w.length-1]); byLast[l]=byLast[l]===undefined?t.k:null; } });
  for (const p of parts){ const k=byLast[key(p)]; if (k) return k; }
  return null;
}
async function syncDrivePhotos(mcp){
  if (photoSyncRunning || !S.assets || !S.snap || !S.canEdit) return; photoSyncRunning=true;
  let done=0, failed=0;
  try{
    const files=[]; let tok="";
    for (let i=0;i<5;i++){
      const args={query:`parentId = '${PHOTO_FOLDER}'`, pageSize:50, excludeContentSnippets:true}; if(tok) args.pageToken=tok;
      const r=await mcp.callTool(DRIVE, "search_files", args, {cache:{staleTime:6*3600e3}});
      let p=r.payload; if(typeof p==="string"){ try{p=JSON.parse(p);}catch(_){p={};} }
      (p.files||[]).forEach(f=>files.push(f)); tok=p.nextPageToken||""; if(!tok) break;
    }
    for (const f of files){
      if (!/^image\//.test(f.mimeType||"")) continue;
      const k=matchTechKey(f.title); if(!k) continue;
      const cur=S.techs[k]||{}, src="drive:"+f.id+":"+(f.modifiedTime||"");
      if (cur.photoSrc==="removed") continue;                             // manager removed it on purpose
      if (cur.photo && cur.photoSrc===src) continue;                       // already have this one
      if (cur.photo && !String(cur.photoSrc||"").startsWith("drive:")) continue; // a manager uploaded one by hand — keep it
      try{
        const d=await mcp.callTool(DRIVE, DL_TOOL, {fileId:f.id}, {cache:{staleTime:864e5}});
        let p=d.payload; if(typeof p==="string"){ try{p=JSON.parse(p);}catch(_){} }
        if(!p||!p.content) throw new Error("empty");
        const small=await resize(b64ToBlob(String(p.content).replace(/\\u003d/g,"="), p.mimeType||f.mimeType), 480, true);
        const a=await S.assets.upload(small);
        await saveTech(k, {photo:a.id, photoSrc:src}, true);
        done++;
      }catch(e){ failed++; console.warn("photo", f.title, e); }
    }
    if (done) toast(`Loaded ${done} tech photo${done>1?"s":""} from Drive`);
    if (failed) toast(`${failed} photo${failed>1?"s":""} couldn't load from Drive. Upload them in Techs & photos.`);
  } catch(e){ console.warn("photo folder", e); }
  finally{ photoSyncRunning=false; if(route()==="admin") renderAdmin(); }
}

// Renders the logo PDF the same way the team portal did: mark + wordmark, dark ink turned white for the black header.
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("load "+src)); document.head.appendChild(s); }); }
async function renderPortalLogo(b64){
  if (!window.pdfjsLib){ await loadScript(PDFJS+"pdf.min.js"); await loadScript(PDFJS+"pdf.worker.min.js"); }
  const bin=Uint8Array.from(atob(b64), c=>c.charCodeAt(0));
  const pdf=await pdfjsLib.getDocument({data:bin, isEvalSupported:false}).promise;
  const shapes=[];
  for (let n=1;n<=Math.min(pdf.numPages,8);n++){
    const page=await pdf.getPage(n); const v0=page.getViewport({scale:1}); const scale=Math.min(6, 1400/Math.max(v0.width,v0.height));
    const vp=page.getViewport({scale}); const c=document.createElement("canvas"); c.width=Math.ceil(vp.width); c.height=Math.ceil(vp.height);
    const ctx=c.getContext("2d",{willReadFrequently:true}); ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height);
    await page.render({canvasContext:ctx, viewport:vp}).promise;
    const img=ctx.getImageData(0,0,c.width,c.height), d=img.data; let x0=c.width,y0=c.height,x1=-1,y1=-1;
    for (let i=0;i<d.length;i+=4){
      const r=d[i],g=d[i+1],b=d[i+2], mx=Math.max(r,g,b), mn=Math.min(r,g,b);
      let a;
      if (mx-mn < 28){ a=1-mn/255; d[i]=d[i+1]=d[i+2]=255; }                 // black/gray ink → white, anti-aliasing kept as alpha
      else { a=Math.min(1,(255-mn)/217); d[i]=38; d[i+1]=164; d[i+2]=203; }   // brand blue
      if (a<0.06) a=0;
      d[i+3]=Math.round(a*255);
      if (a>0){ const p=i/4, x=p%c.width, y=(p/c.width)|0; if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
    }
    if (x1<0) continue;
    ctx.putImageData(img,0,0);
    const w=x1-x0+1, h=y1-y0+1, H=Math.min(h,360), W=Math.round(w*H/h);
    const o=document.createElement("canvas"); o.width=W; o.height=H; o.getContext("2d").drawImage(c,x0,y0,w,h,0,0,W,H);
    shapes.push({n, ratio:w/h, url:o.toDataURL("image/png")});
  }
  if (!shapes.length) throw new Error("empty logo pdf");
  // portal used page 4 as the mark and page 2 as the wordmark; fall back to shape if the file differs
  const byN=k=>shapes.find(x=>x.n===k);
  let mark=byN(4), word=byN(2);
  if (!mark || mark.ratio>2.2) mark=shapes.slice().sort((a,b)=>Math.abs(a.ratio-1)-Math.abs(b.ratio-1))[0];
  if (!word || word.ratio<2.2) word=shapes.filter(x=>x!==mark).sort((a,b)=>b.ratio-a.ratio)[0];
  return {mark:mark.url, word:word&&word.ratio>2?word.url:"" };

async function loadPortalLogo(mcp){
  try{
    const r = await mcp.callTool(DRIVE, DL_TOOL, {fileId: LOGO_PDF}, {cache:{staleTime:864e5}});
    let p=r.payload; if(typeof p==="string"){ try{p=JSON.parse(p);}catch(_){} }
    if(!p||!p.content) return;
    const P = await renderPortalLogo(String(p.content).replace(/\\u003d/g,"="));
    applyPortalLogo(P);
    if (S.db && S.canEdit && (P.mark.length+P.word.length)<240000){ const cur=await S.db.doc("board/portallogo").get().catch(()=>null); if(!cur||!cur.exists||cur.data().mark!==P.mark) await S.db.doc("board/portallogo").set({...P, at:Date.now()}); }
  }catch(e){ console.warn("portal logo", e); }
}
async function loadLogo(mcp){
  try{
    const r = await mcp.callTool(DRIVE, DL_TOOL, {fileId: LOGO_FILE}, {cache:{staleTime:864e5}});
    let p=r.payload; if(typeof p==="string"){ try{p=JSON.parse(p);}catch(_){} }
    if(!p||!p.content) return;
    const data="data:"+(p.mimeType||"image/png")+";base64,"+String(p.content).replace(/\\u003d/g,"=");
    if (data===S.logoData) return;
    S.logoData=data; render(true);
    if (S.db && S.canEdit && data.length<250000){ const cur=await S.db.doc("board/logo").get().catch(()=>null); if(!cur||!cur.exists||cur.data().data!==data) await S.db.doc("board/logo").set({data, at:Date.now()}); }
  }catch(e){ /* keep text logo */ }
}

/* ===================== sheet sync ===================== */
function onDrive(ev){
  if (ev.type==="error"){
    const c=ev.error&&ev.error.code;
    const msg = {needs_reauth:"Google Drive needs to be reconnected. Go to claude.ai Settings → Connectors → Google Drive.",
      server_not_connected:"Add the Google Drive connector in claude.ai Settings → Connectors so the board can read the sheet.",
      selection_required:"Choose which Google Drive account to use when claude.ai asks.",
      not_in_manifest:"Google Drive access was turned off for this page. The board is showing the last numbers pushed.",
      tool_error:"Google Drive couldn't open the sheet: "+((ev.error&&ev.error.message)||"").slice(0,140),
      server_unavailable:"Google Drive didn't answer. Retrying on the next refresh."}[c] || "Couldn't read the sheet right now. Showing the last numbers pushed.";
    S.sync={state:"error", msg}; if(route()==="admin") renderAdmin(); return;
  }
  try{
    let p = ev.result && ev.result.payload;
    if (typeof p==="string"){ try{ p=JSON.parse(p); }catch(_){ } }
    const b64 = p && (p.content || (p.file&&p.file.content));
    if (!b64 || typeof b64!=="string") throw new Error("The sheet came back empty.");
    if (typeof XLSX==="undefined") throw new Error("The spreadsheet reader didn't load. Reload the page.");
    const wb = XLSX.read(b64.replace(/\\u003d/g,"="), {type:"base64", cellDates:true});
    const snap = buildSnapshot(wb);
    const storedAt = (ev.result.cache&&ev.result.cache.storedAt) || Date.now();
    applySnapshot(snap, storedAt, "sheet");
    S.sync={state:"ok", msg:`Reading "${(p.title||"3R Rotating KPI Board")}" from Google Drive. ${Object.keys(snap.techs).length} names, data through ${snap.dataThrough||"—"}.`};
    pushSnapshot(snap);
    render(true);
    if (S.mcp) syncDrivePhotos(S.mcp);
  }catch(e){ S.sync={state:"error", msg:(e&&e.message)||"Couldn't read the sheet."}; if(route()==="admin") renderAdmin(); }
}
let lastPushed = "";
async function pushSnapshot(snap){
  if (!S.db || !S.canEdit) return;
  const body = {...snap}; delete body.builtAt; const h = hashStr(JSON.stringify(body));
  if (h===lastPushed) return; lastPushed=h;
  try { await S.db.doc("board/snapshot").set({...snap, hash:h, pushedAt:Date.now()}); }
  catch(e){ lastPushed=""; if (e&&e.code==="quota_exceeded") toast("Board storage is full"); }
}
function applySnapshot(snap, at, src){ S.snap=snap; S.snapAt=at; S.snapSource=src; }

/* ===================== routing ===================== */
function route(){ const h=location.hash.replace("#",""); if (h==="admin") return "admin"; if (h==="board") return "board"; return "board"; }
function render(soft){
  const r=route();
  $("#boardBtn").textContent = r==="admin"?"Open board":"Admin";
  if (r==="board") { renderBoard(); }
  else { clearTimeout(slideTimer); renderAdmin(); }
}
window.addEventListener("hashchange", ()=>render());
document.addEventListener("keydown", e=>{ if(route()!=="board") return; if(e.key==="ArrowRight") go(1); if(e.key==="ArrowLeft") go(-1); if(e.key===" "){ e.preventDefault(); S.paused=!S.paused; renderBoard(); } });
$("#boardBtn").onclick=()=>{ location.hash = route()==="admin"?"board":"admin"; };

/* theme */
(function(){ let t=null; try{t=localStorage.getItem("3r-kpi-theme");}catch(_){}
  if(t) document.documentElement.dataset.theme=t;
  const upd=()=>{ const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches; $("#themeBtn").textContent = dark?"Light":"Dark"; };
  $("#themeBtn").onclick=()=>{ const dark=$("#themeBtn").textContent==="Light"; const n=dark?"light":"dark"; document.documentElement.dataset.theme=n; try{localStorage.setItem("3r-kpi-theme",n);}catch(_){} upd(); };
  upd(); })();

/* ===================== hub mode (GitHub Pages / any TV browser) ===================== */
// Reads the 3R Data Hub web app. Set once in the TV's URL: ?hub=<Apps Script /exec URL>&t=<HUB_TOKEN>
const HUB_URL = "";   // optional: paste the /exec URL here instead of using ?hub=
function hubMode(){
  const q=new URLSearchParams(location.search); const ls=(k,v)=>{ try{ if(v) localStorage.setItem(k,v); return localStorage.getItem(k)||""; }catch(_){ return v||""; } };
  const url = ls("3r-hub-url", q.get("hub")) || HUB_URL, tok = ls("3r-hub-t", q.get("t"));
  if (!url || !tok){ S.sync={state:"error",msg:"Add ?hub=<data hub URL>&t=<token> to this page's address once. The TV remembers it."}; render(); return; }
  if (q.get("hub")) history.replaceState(null,"",location.pathname+location.hash);
  const pull = async () => {
    try{
      const r = await fetch(url+(url.includes("?")?"&":"?")+"t="+encodeURIComponent(tok)+"&view=snapshot", {cache:"no-store"});
      const j = await r.json(); if(!j.ok) throw new Error(j.error||"hub error");
      const snap=j.snapshot, c=snap.cfg||{}, cfg=defaultCfg();
      ["rotateSec"].forEach(k=>{ if(c[k]) cfg[k]=Math.min(120,Math.max(5,+c[k]||15)); });
      ["boardPeriod","spotMode","coSource"].forEach(k=>{ if(c[k]) cfg[k]=String(c[k]); });
      if (c.tvGrades!==undefined && c.tvGrades!=="") cfg.tvGrades = !/^(n|no|false|0)$/i.test(String(c.tvGrades));
      String(c.slidesOff||"").split(",").map(x=>x.trim()).filter(Boolean).forEach(k=>cfg.slides[k]=false);
      METRICS.forEach(m=>{ if(c["w_"+m.k]!==undefined&&c["w_"+m.k]!=="") cfg.metrics[m.k].w=+c["w_"+m.k]||0; if(c["t_"+m.k]) cfg.metrics[m.k].target=+c["t_"+m.k]||m.target; });
      if (c.logoPlate!==undefined && c.logoPlate!=="") cfg.logoPlate = !/^(n|no|false|0)$/i.test(String(c.logoPlate));
      S.logoData = snap.logo || S.logoData;
      if (snap.logoPdf && snap.logoPdfHash !== (S.portalLogo||{}).h) renderPortalLogo(snap.logoPdf).then(P=>{ P.h=snap.logoPdfHash; applyPortalLogo(P); }).catch(e=>console.warn("portal logo",e)); S.cfg=cfg; S.techs=snap.techMeta||{}; applySnapshot(snap, snap.builtAt, "hub");
      S.sync={state:"ok",msg:"Live from the 3R Data Hub"}; render(true);
    }catch(e){ S.sync={state:"error",msg:"Couldn't reach the data hub. Showing the last numbers."}; if(!S.snap) render(); }
  };
  pull(); lightLoop(pull);
}

const SHEET_KEY = "AIzaSyDEx9g5DCVefcTK8Qa1FGSN8mAMZKEifqQ";
const SHEET_TABS = ["Goals","YTD Goals","Actuals","Leaderboard","Reviews","Announcements","Call Back Record","Install Record","ST Jobs","ST Estimates","ST Techs","ST Timesheets","Automation Jobs"," Automation Estimates","Weather","Board_Config","Board_Techs","Board_Updates"];
function fetchT(u, ms){ const c=new AbortController(); const t=setTimeout(()=>c.abort(), ms||25000); return fetch(u,{cache:"no-store",signal:c.signal}).finally(()=>clearTimeout(t)); }
async function fetchTab(id, tab){
  const u=`https://sheets.googleapis.com/v4/spreadsheets/${id}/values/${encodeURIComponent("'"+tab+"'")}?valueRenderOption=UNFORMATTED_VALUE&dateTimeRenderOption=FORMATTED_STRING&key=${SHEET_KEY}`;
  const r=await fetchT(u); if(!r.ok) return null; const j=await r.json(); return j.values||[];
}
async function directWeather(){
  try{
    const r=await fetchT("https://api.open-meteo.com/v1/forecast?latitude=42.1615&longitude=-70.7928&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FNew_York&forecast_days=6");
    const j=await r.json(); const c=j.current,d=j.daily;
    return {place:"Norwell, MA", t:c.temperature_2m, f:c.apparent_temperature, c:c.weather_code, w:c.wind_speed_10m, up:Date.now(), days:d.time.map((x,i)=>({d:x,c:d.weather_code[i],hi:d.temperature_2m_max[i],lo:d.temperature_2m_min[i],p:d.precipitation_probability_max[i]||0}))};
  }catch(e){ return null; }
}
function sheetMode(){
  const q=new URLSearchParams(location.search); const id=q.get("sheet")||DEFAULT_SHEET;
  restoreCached();
  let busy=false;
  const pull = async () => {
    if (busy) return; busy=true;
    try{
      const tabs = await Promise.all(SHEET_TABS.map(t=>fetchTab(id,t).catch(()=>null)));
      const wb={SheetNames:[],Sheets:{}}; const rows={};
      SHEET_TABS.forEach((t,i)=>{ if(tabs[i]) { rows[t.trim().toLowerCase()]=tabs[i]; wb.SheetNames.push(t); } });
      if (!wb.SheetNames.length) throw new Error("Couldn't read the KPI sheet. Check it's shared \"anyone with the link can view\".");
      wb.__rows=rows;
      const snap=buildSnapshot(wb);
      if (!snap.weather) snap.weather = await directWeather();
      // Board_Config / Board_Techs
      const cfgRows=rows["board_config"]||[]; const c={}; cfgRows.slice(1).forEach(r=>{ if(String(r[0]||"").trim()) c[String(r[0]).trim()]=r[1]; });
      const tRows=rows["board_techs"]||[]; const meta={}; tRows.slice(1).forEach(r=>{ const k=String(r[0]||"").trim().toLowerCase(); if(!k) return; meta[k]={display:String(r[1]||""), show:(r[2]===""||r[2]==null)?undefined:/^(y|yes|true|1)$/i.test(String(r[2])), photo:String(r[3]||""), rating:+r[4]||0, role:String(r[5]||"")||undefined}; });
      applyHubCfg(c); S.techs=meta; applySnapshot(snap, Date.now(), "sheet");
      S.sync={state:"ok",msg:"Live from the KPI sheet"}; saveCached(); render(true);
    }catch(e){ S.sync={state:"error",msg:(e&&e.message)||"Couldn't reach the sheet. Showing the last numbers."}; if(!S.snap) render(); }
    finally{ busy=false; }
  };
  pull(); lightLoop(pull);
}

function nextPullMs(){ const h=new Date().getHours(); return (h>=6&&h<19) ? 15*60*1000 : 60*60*1000; }
function lightLoop(pull){
  const tick2=()=>{ setTimeout(()=>{ if(document.visibilityState!=="hidden") pull(); tick2(); }, nextPullMs()); }; tick2();
  window.addEventListener("online", ()=>setTimeout(pull, 3000));
}
function saveCached(){ try{ localStorage.setItem("3r-board-cache", JSON.stringify({snap:S.snap, cfg:S.cfg, techs:S.techs, at:S.snapAt})); }catch(_){ /* too big or blocked: fine */ } }

function applyHubCfg(c){
  const cfg=defaultCfg();
  if(c.rotateSec) cfg.rotateSec=Math.min(120,Math.max(5,+c.rotateSec||15));
  ["boardPeriod","spotMode","coSource"].forEach(k=>{ if(c[k]) cfg[k]=String(c[k]); });
  if (c.tvGrades!==undefined && c.tvGrades!=="") cfg.tvGrades = !/^(n|no|false|0)$/i.test(String(c.tvGrades));
  String(c.slidesOff||"").split(",").map(x=>x.trim()).filter(Boolean).forEach(k=>cfg.slides[k]=false);
  METRICS.forEach(m=>{ if(c["w_"+m.k]!==undefined&&c["w_"+m.k]!=="") cfg.metrics[m.k].w=+c["w_"+m.k]||0; if(c["t_"+m.k]) cfg.metrics[m.k].target=+c["t_"+m.k]||m.target; });
  S.cfg=cfg;
}

(async function boot(){
  const C = window.claude;
  if (!C || typeof C.use!=="function"){ reliability(); if (new URLSearchParams(location.search).get("hub")) hubMode(); else sheetMode(); return; }
  const [user, db] = await Promise.all([C.use("user").catch(()=>null), C.use("db").catch(()=>null)]);
  if (user){ try{ S.canEdit = !!(await user.canEdit()); S.isOwner = !!(await user.isOwner()); }catch(_){} }

    db.doc("config/settings").onSnapshot(s=>{ if(s.exists){ const d=s.data(); S.cfg={...defaultCfg(), ...d, slides:{...defaultCfg().slides, ...(d.slides||{})}, metrics:{...defaultCfg().metrics, ...(d.metrics||{})}, appMetrics:{...defaultCfg().appMetrics, ...(d.appMetrics||{})}, salesMetrics:{...defaultCfg().salesMetrics, ...(d.salesMetrics||{})}}; render(true);} }, ()=>{});
